# Keep the classic `Ctrl-b` prefix (matching git_nvim_tmux_config shortcuts).
set -g prefix C-b
unbind C-a

# Double-tap `Ctrl-b` to toggle pane zoom (in addition to `prefix + z`).
bind-key C-b resize-pane -Z

# split panes using \ and - (and | / _), opening at current path for |, -, _
bind \\ split-window -h
bind - split-window -v -c "#{pane_current_path}"
# split panes at current directory (| and _)
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."
bind R source-file ~/.tmux.conf \; display-message "Config reloaded..."
# Refresh direct mise tool paths at server start and on config reload (prefix r).
# Use the home directory's tool selection for server-wide commands. Without mise,
# leave tmux's environment alone; also check mise's default install location.
run-shell 'mise_bin="$(command -v mise)" || mise_bin="$HOME/.local/bin/mise"; if [ -x "$mise_bin" ]; then mise_env="$("$mise_bin" -C "$HOME" env -s bash)" && eval "$mise_env" && tmux set-environment -g PATH "$PATH"; fi'

# Real directory of this config (~/.tmux.conf symlinks into the dotfiles repo), so
# scripts can be referenced as #{@tmux_dir}/scripts/... without hardcoding the repo path.
run-shell 'tmux set -g @tmux_dir "$(dirname "$(readlink -f ~/.tmux.conf)")"'

# Moving between panes.
# Use tmux.nvim plugin if possible. (Ctrl+ h,j,k,l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on
# Mouse wheel (Linux only)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

# don't rename windows automatically
#set-option -g allow-rename off

# forward inner program's OSC title (#T = pane_title) to the outer terminal
set -g set-titles on
set -g set-titles-string "#T"

# passthrough OSC52 clipboard copy
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ",*:hyperlinks"
# Forward OSC 9;4 progress reports out to the terminal (tmux 3.7). tmux stores
# them per pane either way (#{pane_pb_state}, #{pane_pb_progress}); this feature
# is what makes it pass them on, so kitty can draw its own progress_bar and put
# progress on the macOS Dock icon. Client features are fixed when a client
# attaches, so this only takes effect on a fresh attach, not on a config reload.
set -as terminal-features ",*:progressbar"

# OSC 133 navigate per prompt
# needs tmux 3.4
# needs to print the osc 133 sequence before each prompt
# in bash, use PROMPT_COMMAND
# in zsh, use precmd()
# in this dotfiles, we have `wezterm.zsh` to set this up following
# https://wezterm.org/shell-integration.html
bind-key -T copy-mode-vi [ send-keys -X previous-prompt
bind-key -T copy-mode-vi ] send-keys -X next-prompt
# Jump between prompts with Ctrl+Alt+Up/Down from normal mode too.
bind -n C-M-k if-shell -F '#{pane_in_mode}' 'send-keys -X previous-prompt' 'copy-mode; send-keys -X previous-prompt'
bind -n C-M-j if-shell -F '#{pane_in_mode}' 'send-keys -X next-prompt'     'copy-mode; send-keys -X next-prompt'
# Same jump on Shift+Up/Down, matching kitty's shift+up/shift+down mapping
# outside tmux. The two never collide: kitty's scroll_to_prompt returns
# passthrough whenever the alternate screen is active, which is exactly when
# tmux is running, so kitty takes the key at a bare shell and tmux takes it here.
bind -n S-Up   if-shell -F '#{pane_in_mode}' 'send-keys -X previous-prompt' 'copy-mode; send-keys -X previous-prompt'
bind -n S-Down if-shell -F '#{pane_in_mode}' 'send-keys -X next-prompt'     'copy-mode; send-keys -X next-prompt'

# v3.6
# set-option -g pane-scrollbars modal
# Guarded so an older tmux (e.g. a distro package before mise installs the
# latest) starts without "invalid option" errors.
%if "#{m/r:^(next-|3[.]([6-9]|[1-9][0-9])|[4-9]),#{version}}"
set-option -g pane-scrollbars on
set -g pane-scrollbars-style "fg=#392a48,width=1,pad=0"
# bump if you use SIXEL, kitty graphics, etc.
set -s input-buffer-size 128000000
%endif

# Pass modified keys such as Shift+Enter to terminal applications.
set -s extended-keys always
%if "#{m/r:^(next-|3[.]([5-9]|[1-9][0-9])|[4-9]),#{version}}"
set -s extended-keys-format csi-u
%endif
set -as terminal-features ',wezterm:extkeys,xterm-256color:extkeys,xterm-kitty:extkeys'
# Kitty needs its own keyboard-mode request instead of xterm modifyOtherKeys.
# Request only disambiguation (flag 1), which tmux can decode, and restore on exit.
set -as terminal-overrides ',xterm-kitty:Eneks=\E[>1u:Dseks=\E[<u'
# With flag 1 kitty sends a bare Esc as \e[27u, which tmux 3.7 misparses as
# Alt+[ followed by literal "27u". Teach tmux the sequence explicitly.
set -s user-keys[0] "\e[27u"
bind -n User0 send-keys Escape

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move current pane to next/prev window
# Get the next window id by calling the script
bind -r N run-shell "tmux join-pane -h -t $(~/.config/dotfiles/tmux/scripts/get_next_window_uid.sh)"
bind -r P run-shell "tmux join-pane -h -t $(~/.config/dotfiles/tmux/scripts/get_prev_window_uid.sh)"
bind b run-shell "tmux break-pane"

# Synchronize panes & swap current pane with the first pane
bind-key a set-window-option synchronize-panes
bind S swap-pane -s '{top-left}'

# reorder windows.
# C-S-Left/Right are reserved for WezTerm tab moving; use </> or M-F2/F3/F5/F6 below instead.
# bind-key -n C-S-Left swap-window -d -t -1
# bind-key -n C-S-Right swap-window -d -t +1
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# 256 colour
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"

# This works with wezterm.
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Home End key doesn't work?
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
# set-window-option -g xterm-keys on

# Vimlike copy mode.
# WARN: tmux-yank plugin may override this.

bind-key Escape copy-mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
# unbind -T copy-mode-vi Enter
# `copy-pipe` with no argument pipes to the `copy-command` option, which
# scripts/set-copy-command.sh sets per OS (pbcopy / clip.exe / wl-copy / xclip /
# xsel). OSC 52 (`set-clipboard on`) also copies over SSH with no helper at all.
run-shell '#{@tmux_dir}/scripts/set-copy-command.sh'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

## Hold and drag a window title to reorder windows
# Each press gets a generation number. Only that generation becomes draggable
# after 0.5 seconds, so the status redraw caused by a normal click cannot turn
# a tiny pointer movement into an accidental reorder.
set-option -goq @window_drag_generation 0

unbind-key -T root MouseDown1Status
unbind-key -T prefix MouseDown1Status
unbind-key -T root MouseDragEnd1Status
bind-key -T root MouseDown1Status {
  set-option -F @window_drag_generation '#{e|+:#{@window_drag_generation},1}'
  set-option -qu @window_drag_ready
  set-option -qu @window_drag_target
  set-option -qu @window_drag_target_index
  set-option -qu @window_drag_source_index
  set-option -F @window_drag_source '#{?#{==:#{mouse_status_range},window},#{window_id},#{mouse_status_range}}'
  set-option -F @window_drag_source_index '#{W:#{?#{==:#{window_id},#{@window_drag_source}},#{window_index},}}'
  run-shell -bC -d 0.5 'set-option -t "#{session_id}" @window_drag_ready "#{@window_drag_generation}" ; refresh-client -S -t "#{client_name}"'
  run-shell -C 'switch-client -t "#{session_id}:#{@window_drag_source}"'
  switch-client -T window-drag
}
bind-key -T prefix MouseDown1Status {
  set-option -F @window_drag_generation '#{e|+:#{@window_drag_generation},1}'
  set-option -qu @window_drag_ready
  set-option -qu @window_drag_target
  set-option -qu @window_drag_target_index
  set-option -qu @window_drag_source_index
  set-option -F @window_drag_source '#{?#{==:#{mouse_status_range},window},#{window_id},#{mouse_status_range}}'
  set-option -F @window_drag_source_index '#{W:#{?#{==:#{window_id},#{@window_drag_source}},#{window_index},}}'
  run-shell -bC -d 0.5 'set-option -t "#{session_id}" @window_drag_ready "#{@window_drag_generation}" ; refresh-client -S -t "#{client_name}"'
  run-shell -C 'switch-client -t "#{session_id}:#{@window_drag_source}"'
  switch-client -T window-drag
}

# The window formats below expose the hovered window ID through
# mouse_status_range. Preview only after this press has passed the hold delay.
bind-key -T window-drag MouseDrag1Status {
  if-shell -F '#{m/r:^@[0-9]+$,#{mouse_status_range}}' {
    set-option -F @window_drag_target '#{mouse_status_range}'
    set-option -F @window_drag_target_index '#{W:#{?#{==:#{window_id},#{@window_drag_target}},#{window_index},}}'
  } {
    set-option -qu @window_drag_target
    set-option -qu @window_drag_target_index
  }
  switch-client -T window-drag
}

# Swallow motion outside the window list while a title drag is active. The
# catch-all binding below cancels on release (or any unrelated key).
bind-key -T window-drag MouseDrag1Pane { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1Border { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1StatusDefault { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1StatusLeft { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1StatusRight { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
%if "#{m/r:^(next-|3[.]([6-9]|[1-9][0-9])|[4-9]),#{version}}"
bind-key -T window-drag MouseDrag1ScrollbarSlider { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1ScrollbarUp { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
bind-key -T window-drag MouseDrag1ScrollbarDown { set-option -qu @window_drag_target; set-option -qu @window_drag_target_index; switch-client -T window-drag; }
%endif

# tmux draws clipped-window < and > markers as StatusDefault, not as windows.
# Their columns sit immediately after status-left plus the first-window button,
# and immediately before the last-window button plus status-right.
bind-key -T root MouseDown1StatusDefault if-shell -F '#{==:#{mouse_x},#{e|+:#{w:#{T;=/#{status-left-length}:status-left}},#{w:#{E:@window_list_first_button}}}}' 'previous-window' 'if-shell -F "#{==:#{mouse_x},#{e|-:#{client_width},#{e|+:#{w:#{T;=/#{status-right-length}:status-right}},#{e|+:#{w:#{E:@window_list_last_button}},1}}}}" "next-window" "run-shell -b :"'
bind-key -T prefix MouseDown1StatusDefault if-shell -F '#{==:#{mouse_x},#{e|+:#{w:#{T;=/#{status-left-length}:status-left}},#{w:#{E:@window_list_first_button}}}}' 'previous-window' 'if-shell -F "#{==:#{mouse_x},#{e|-:#{client_width},#{e|+:#{w:#{T;=/#{status-right-length}:status-right}},#{e|+:#{w:#{E:@window_list_last_button}},1}}}}" "next-window" "run-shell -b :"'
bind-key -T window-drag MouseDragEnd1Status {
  if-shell -F '#{&&:#{==:#{@window_drag_ready},#{@window_drag_generation}},#{&&:#{m/r:^@[0-9]+$,#{@window_drag_source}},#{&&:#{m/r:^@[0-9]+$,#{@window_drag_target}},#{&&:#{m/r:^[0-9]+$,#{@window_drag_source_index}},#{&&:#{m/r:^[0-9]+$,#{@window_drag_target_index}},#{!=:#{@window_drag_source},#{@window_drag_target}}}}}}}' {
    run-shell -C 'move-window #{?#{e|<:#{@window_drag_target_index},#{@window_drag_source_index}},-b,-a} -s "#{session_id}:#{@window_drag_source}" -t "#{session_id}:#{@window_drag_target}" ; move-window -r -t "#{session_id}:"'
  }
  set-option -F @window_drag_generation '#{e|+:#{@window_drag_generation},1}'
  set-option -qu @window_drag_ready
  set-option -qu @window_drag_target
  set-option -qu @window_drag_target_index
  set-option -qu @window_drag_source
  set-option -qu @window_drag_source_index
  switch-client -T root
}

# Releasing anywhere except a window title cancels and clears the preview.
bind-key -T window-drag MouseDragEnd1StatusDefault {
  set-option -F @window_drag_generation '#{e|+:#{@window_drag_generation},1}'
  set-option -qu @window_drag_ready
  set-option -qu @window_drag_target
  set-option -qu @window_drag_target_index
  set-option -qu @window_drag_source
  set-option -qu @window_drag_source_index
  switch-client -T root
}

bind-key -T window-drag Any {
  set-option -F @window_drag_generation '#{e|+:#{@window_drag_generation},1}'
  set-option -qu @window_drag_ready
  set-option -qu @window_drag_target
  set-option -qu @window_drag_target_index
  set-option -qu @window_drag_source
  set-option -qu @window_drag_source_index
  switch-client -T root
}

## Click rabbit on the bottom left to toggle prefix mode
# Use MouseUp to enter prefix mode; MouseDown would be consumed by the paired release.
# Prefix-mode clicks go through a temporary table so the release toggles prefix off.
bind-key -T root MouseDown1StatusLeft run-shell -b ':'
bind-key -T root MouseUp1StatusLeft switch-client -T prefix
bind-key -T prefix MouseDown1StatusLeft switch-client -T rabbit-prefix-toggle-off
bind-key -T rabbit-prefix-toggle-off MouseUp1StatusLeft switch-client -T root

# Ctrl+a + q to show pane numbers, for long time.
set -g display-panes-time 4000

# Setting the delay between prefix and command.
set -sg escape-time 1

# Set the base index for windows to 1 instead of 0.
set -g base-index 1

# Set the base index for panes to 1 instead of 0.
setw -g pane-base-index 1

# Cache 50000 lines for scroll back
set-option -g history-limit 50000

# Enable vi keys.
# setw -g mode-keys vi

# toggle between two panes / windows
bind-key t last-window
bind-key T last-pane

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


# set default directory for new windows in this session to current directory:
#bind M-c attach-session -c "#{pane_current_path}"

# open a new window in the current directory
bind C new-window -c "#{pane_current_path}"


# Kill window is by default mapped to prefix + &
# Kill pane is by default mapped to prefix + x
# Kill session
bind X confirm-before kill-session


# tmux.nvim seamless navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'C-\' select-pane -l

# tmux.nvim seamless resizing
bind -n 'C-M-y' if-shell "$is_vim" 'send-keys C-M-y' 'resize-pane -L 4'
bind -n 'C-M-u' if-shell "$is_vim" 'send-keys C-M-u' 'resize-pane -D 2'
bind -n 'C-M-i' if-shell "$is_vim" 'send-keys C-M-i' 'resize-pane -U 2'
bind -n 'C-M-o' if-shell "$is_vim" 'send-keys C-M-o' 'resize-pane -R 4'

bind-key -T copy-mode-vi C-M-y resize-pane -L 4
bind-key -T copy-mode-vi C-M-u resize-pane -D 2
bind-key -T copy-mode-vi C-M-i resize-pane -U 2
bind-key -T copy-mode-vi C-M-o resize-pane -R 4

bind -n 'C-F3' if-shell "$is_vim" 'send-keys C-F3' 'resize-pane -L 4'
bind -n 'C-F2' if-shell "$is_vim" 'send-keys C-F2' 'resize-pane -L 4'
bind -n 'C-F6' if-shell "$is_vim" 'send-keys C-F6' 'resize-pane -R 4'
bind -n 'C-F7' if-shell "$is_vim" 'send-keys C-F7' 'resize-pane -R 4'
bind -n 'S-F3' if-shell "$is_vim" 'send-keys S-F3' 'resize-pane -U 2'
bind -n 'S-F2' if-shell "$is_vim" 'send-keys S-F2' 'resize-pane -U 2'
bind -n 'S-F6' if-shell "$is_vim" 'send-keys S-F6' 'resize-pane -D 2'


bind -n 'M-F2' swap-window -d -t -1  # Alt + knob counter-clockwise
bind -n 'M-F3' swap-window -d -t -1  # Alt + knob counter-clockwise
bind -n 'M-F5' swap-window -d -t +1  # Alt + knob clockwise
bind -n 'M-F6' swap-window -d -t +1  # Alt + knob clockwise
bind -n F8 previous-window  # fn + knob counter-clockwise
bind -n F10 next-window  # fn + knob clockwise

is_nvim_or_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(nvim|fzf)$'"
bind -n 'F2' if-shell "$is_nvim_or_fzf" 'send-keys F2' 'previous-window'
bind -n 'F3' if-shell "$is_nvim_or_fzf" 'send-keys F3' 'previous-window'
bind -n 'F5' if-shell "$is_nvim_or_fzf" 'send-keys F5' 'next-window'
bind -n 'F6' if-shell "$is_nvim_or_fzf" 'send-keys F6' 'next-window'

# https://www.ditig.com/256-colors-cheat-sheet
# white, black etc. are not accurate (they follow system colour).
# Use grey100, grey0 instead.

# --- Define Mohan colour scheme (Monokai colours) (from git_nvim_tmux_config) --- #
_tmux_white=colour15
_tmux_black=colour232
_tmux_red=colour1
_tmux_purple=colour54
_tmux_grey_l=colour145
_tmux_grey_d=colour236
_tmux_blue=colour25
_tmux_yellow=colour154
_tmux_blue_d=colour17
# ---------------------------------------------------------------- #

#  modes
setw -g clock-mode-colour colour154
setw -g mode-style 'fg=colour232 bg=colour154 bold'

# panes (Mohan theme orange active border)
set -g pane-border-style 'fg=colour236'
set -g pane-active-border-style 'fg=colour208'

# statusbar
set -g status 'on'
set -g status-position bottom
set -g status-bg 'colour235'
set -g status-justify 'centre'
set -g status-left-length 100
set -g status-right-length 100
set -g message-style fg='colour222',bg='colour238'
set -g message-command-style fg='colour222',bg='colour238'
set -g window-status-activity-style fg='colour154',bg='colour235',none
set -g window-status-separator ''
set -g window-status-style fg='colour121',bg='colour235',none

set -g status-left '#[fg=colour232,bg=colour154,bold]#{?client_prefix,#[bg=colour208],} #S #[fg=colour154,bg=colour238,nobold]#{?client_prefix,#[fg=colour208],}#[fg=colour222,bg=colour238] #W #[fg=colour238,bg=colour235,nobold]#[fg=colour121,bg=colour235]'

set -g status-right '#[fg=yellow,bg=default]cpu #(sh ~/.config/dotfiles/tmux/scripts/cpu.sh 2>/dev/null || sh #{@tmux_dir}/scripts/cpu.sh 2>/dev/null || sh ~/.tmux/cpu.sh 2>/dev/null) #[fg=colour121,bg=colour235] %R %a %m-%d-%Y #[fg=colour238,bg=colour235,nobold]#[fg=colour222,bg=colour238] #(whoami) #[fg=colour154,bg=colour238]#[fg=colour232,bg=colour154,bold] #h '

setw -g window-status-format '#[fg=colour244,bg=colour235] #I #W '
setw -g window-status-current-format '#[fg=colour235,bg=colour238]#[fg=brightyellow,bg=colour238,bold] #I #W #F #[fg=colour238,bg=colour235]'

setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'


# pane status
set -g pane-border-status top 
#set -g pane-border-format '#[fg=grey0,bg=grey50] .#P (#D) pid=#{pane_pid} #{pane_current_command} '

# Mohan theme styled pane border format with agent session id
set -g pane-border-format '#[#{?#{pane_active},fg=#FD971F,fg=colour238},bg=default]#[#{?#{pane_active},fg=#272822,bg=#FD971F,bold,fg=colour247,bg=colour238}] .#P (#D) pid=#{pane_pid} #{pane_current_command}#{?#{m/r:^(codex|claude|node|gh|copilot|opencode|[0-9]+([.][0-9]+)+)$,#{pane_current_command}},#(#{@tmux_dir}/scripts/agent-sid.sh #{pane_id} #{pane_tty}),} #[#{?#{pane_active},fg=#FD971F,fg=colour238},bg=default]'
# simple and dim version
#set -g pane-border-format " .#P (#D) pid=#{pane_pid} #{pane_current_command} "

set -g focus-events on

bind-key Space command-prompt -p "Go to window:" "select-window -t ':%%'"

# For tmux-yank.
# Set this only if you use bash vi mode.
#set -g @shell_mode 'vi'
set -g @yank_action 'copy-pipe'  # do not exit copy mode after yank
set -g @yank_with_mouse off      # we define our own mouse yank above

# For treemux
# set -g @treemux-tree-client 'nvim-tree'
set -g @treemux-tree-client 'neo-tree'
set -g @treemux-tree-nvim-init-file '~/.config/nvim/treemux_init.lua'
# set -g @treemux-tree-nvim-init-file '~/.tmux/plugins/treemux/configs/treemux_init.lua'
set -g @treemux-tree-position 'left'
set -g @treemux-nvim-command 'NVIM_APPNAME=nvim-treemux nvim'
set -g @treemux-python-command '/usr/bin/python3'  # python with pynvim installed
set -g @treemux-refresh-interval 0.1
set -g @treemux-refresh-interval-inactive-pane 2
set -g @treemux-refresh-interval-inactive-window 5
set -g @treemux-enable-debug-pane 0

# extrakto
set -g @extrakto_key 'e'

# dracula theme
# if-shell "uname | grep -q Darwin" "set -g @dracula-plugins 'battery cpu-usage ram-usage'" "set -g @dracula-plugins 'battery cpu-usage gpu-usage ram-usage'"
set -g @dracula-plugins "battery cpu-usage gpu-usage ram-usage"
set -g @dracula-cpu-usage-colors "pink dark_gray"
set -g @dracula-gpu-usage-colors "orange dark_gray"
set -g @dracula-battery-colors "light_purple dark_gray"
set -g @dracula-weather-colors "dark_purple white"
# set -g @dracula-git-colors "red dark_gray"

# Add shape to the status bar
set -g @dracula-show-powerline true
# for left
#set -g @dracula-show-left-sep 
# for right symbol (can set any symbol you like as seperator)
#set -g @dracula-show-right-sep 

set -g @dracula-show-left-icon "🐰"
set -g @dracula-cpu-usage-label "😉"
set -g @dracula-cpu-usage-label-25 "😵"
set -g @dracula-cpu-usage-label-50 "🤕"
set -g @dracula-cpu-usage-label-75 "🤯"
set -g @dracula-gpu-usage-label "🎥"
set -g @dracula-ram-usage-label " "
set -g @dracula-battery-dc-label-0 "🌱"
set -g @dracula-battery-dc-label-35 "🌿"
set -g @dracula-battery-dc-label-70 "🥕"
set -g @dracula-battery-ac-label-0 "💦 🌱"
set -g @dracula-battery-ac-label-35 "💦 🌿"
set -g @dracula-battery-ac-label-70 "💦 🥕"
set -g @dracula-battery-ac-label "🏡"

set -g @dracula-show-fahrenheit false
set -g @dracula-fixed-location "Seoul"
set -g @dracula-show-location false

# Programs that will show the dir name too.
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"
# Programs that will be skipped/ignored when looking for active program.
# set -g @tmux_window_name_ignored_programs "['sqlite3']" # Default is []
set -g @tmux_window_name_max_name_len "20"
set -g @tmux_window_name_show_program_args "True"
set -g @tmux_window_name_use_tilde "True"
# NOTE: how to see tmux options: tmux show -g -v @tmux_window_name_substitute_sets
set -g @tmux_window_name_substitute_sets "[('.+ipython([32])', r'ipython\\g<1>'), ('^(/usr)?/bin/(.+)', r'\\g<2>'), ('(bash) (.+)/(.+[ $])(.+)', r'\\g<3>\\g<4>'), ('^/opt/homebrew/bin/(.+)', r'\\g<1>'), ('^nvim', 'vi')]"
	# 0: from example
	# 1: removing `/usr/bin` and `/bin` prefixes of files
	# 2: removing `bash /long/path/for/bashscript`


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Restore Neovim with `nvim -S` when the pane's directory has a Session.vim.
# Neovim keeps that file up to date with vim-obsession, which starts
# automatically inside tmux (see "tpope/vim-obsession" in nvim/lua/mohan/lazy.lua).
set -g @resurrect-strategy-nvim 'session'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'kiyoon/tmux-yank'
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'kiyoon/tmux-dracula'  # Replaced by Mohan theme (Monokai colours) from git_nvim_tmux_config
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'kiyoon/tmux-window-name'
set -g @plugin 'graffitty/tmux-graffitty'


# Initialize plugins after all of their settings above.
run '~/.tmux/plugins/tpm/tpm'

# Preserve the theme's window formats, then add stable per-window mouse ranges
# and a reserved one-cell drop marker. Replacing the normal separator with the
# reserved cell prevents the status line from shifting when a preview appears.
set-option -gF @window_drag_window_format '#{window-status-format}'
set-option -gF @window_drag_window_current_format '#{window-status-current-format}'
set-option -g @window_drag_preview_active '#{&&:#{==:#{client_key_table},window-drag},#{&&:#{==:#{@window_drag_ready},#{@window_drag_generation}},#{&&:#{!=:#{@window_drag_source},#{@window_drag_target}},#{==:#{window_id},#{@window_drag_target}}}}}'
set-option -g @window_drag_preview_before '#{&&:#{E:@window_drag_preview_active},#{e|<:#{@window_drag_target_index},#{@window_drag_source_index}}}'
set-option -g @window_drag_preview_after '#{&&:#{E:@window_drag_preview_active},#{e|>:#{@window_drag_target_index},#{@window_drag_source_index}}}'
set-option -g @window_drag_marker '#[fg=#f92672,bg=colour238]'
set-window-option -g window-status-separator ''
set-window-option -g window-status-format '#[range=user|#{window_id}]#{?#{E:@window_drag_preview_before},#{E:@window_drag_marker},}#{T:@window_drag_window_format}#{?#{E:@window_drag_preview_before},,#{?#{E:@window_drag_preview_after},#{E:@window_drag_marker}, }}#[norange]'
set-window-option -g window-status-current-format '#[range=user|#{window_id}]#{?#{E:@window_drag_preview_before},#{E:@window_drag_marker},}#{T:@window_drag_window_current_format}#{?#{E:@window_drag_preview_before},,#{?#{E:@window_drag_preview_after},#{E:@window_drag_marker}, }}#[norange]'

# Pagination-style first/last window buttons around the window list (Mohan theme styled):
set-option -g @window_list_first_button '#[range=window|#{W:#{?window_start_flag,#{window_index},}} fg=colour154] 󰘀  #[norange default]'
set-option -g @window_list_last_button '#[range=window|#{W:#{?window_end_flag,#{window_index},}} fg=colour154] 󰘁 #[norange default]'
# tmux 3.7's default status-format[0], plus the first button just before
# #[list=on ...] and the last button just after the #{W:...} window loop.
set-option -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#{E:@window_list_first_button}#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist]#{E:@window_list_last_button}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

