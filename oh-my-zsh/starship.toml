# ~/.config/starship.toml
#
# Two-line prompt. Between commands: blank line + faint rule (drawn by custom/prompt.zsh).
#
#   ───────────────────────────────────────────────────────────────────────────────
#    …/Developer/family_accounting_agent    main !2 ?1  22.1  ✔   8m 20s    mohan   05:41:37 AM
#   ❯ your command here, on its own full-width line
#
# Line 1 = information (any length of branch name fits here)
# Line 2 = only the arrow and what you type
# custom/prompt.zsh also: shrinks old prompts to "❯ cmd", uses a compact line 1 in
# narrow terminals (drops languages, user, time), and switches `palette` to "ssh"
# (orange folder) on remote machines.
# Needs a Nerd Font in the terminal for the rounded pill ends ( ).
#
# Keep one module per line in `format`: prompt.zsh removes lines with sed for the
# compact variant.

add_newline = false         # spacing is done by custom/prompt.zsh
command_timeout = 800       # ms; keeps the prompt fast in big repos
continuation_prompt = "[∙ ](bold #64748b)"
palette = "local"

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$bun\
$python\
$c\
$cpp\
$conda\
$rust\
$golang\
$docker_context\
$kubernetes\
$status\
$cmd_duration\
$username\
$hostname\
$time\
$line_break\
$character"""

[palettes.local]
folder = "#2563eb"          # blue

[palettes.ssh]
folder = "#ea580c"          # orange: you are on a remote machine

# ---------- line 1: where am I ----------

[directory]                 # blue pill (orange over SSH)
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[](fg:folder)[ $path$read_only ](bg:folder fg:#ffffff bold)[](fg:folder) "

[git_branch]                # purple pill
symbol = " "
truncation_length = 40
truncation_symbol = "…"
format = "[](fg:#7c3aed)[ $symbol$branch ](bg:#7c3aed fg:#ffffff bold)[](fg:#7c3aed) "

[git_state]                 # REBASING 2/5, MERGING …
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold #f97316"

[git_status]                # short, after the branch
format = '([$all_status$ahead_behind]($style) )'
style = "bold #eab308"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡ "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ---------- line 1: tool versions, only inside matching projects ----------

[nodejs]
format = "[ $version]($style) "
version_format = "${major}.${minor}"
style = "bold #84cc16"

[bun]
format = "[🥟 $version]($style) "
version_format = "${major}.${minor}"
style = "bold #f5d0a9"

[python]                    # version, plus (venv name) when one is active
format = "[ ${version}( \\($virtualenv\\))]($style) "
version_format = "${major}.${minor}"
style = "bold #facc15"

[c]                         # C compiler version, in folders with .c/.h files
format = "[ $version]($style) "
version_format = "${major}.${minor}"
style = "bold #60a5fa"

[cpp]                       # C++ compiler version, in folders with .cpp/.hpp/... files
disabled = false
format = "[ $version]($style) "
version_format = "${major}.${minor}"
style = "bold #818cf8"

[conda]
format = "[🅒 $environment]($style) "
ignore_base = true
style = "bold #22c55e"

[rust]
format = "[ $version]($style) "
version_format = "${major}.${minor}"
style = "bold #f97316"

[golang]
format = "[ $version]($style) "
version_format = "${major}.${minor}"
style = "bold #22d3ee"

# ---------- line 1: what am I connected to ----------

[docker_context]            # only when not the default context
only_with_files = false
format = "[ $context]($style) "
style = "bold #38bdf8"

[kubernetes]                # cluster and namespace, whenever a context is set
disabled = false
format = "[](fg:#0891b2)[ 󱃾 $context( · $namespace) ](bg:#0891b2 fg:#ffffff bold)[](fg:#0891b2) "

# ---------- line 1: how did it go ----------

[status]                    # ✔ after success, ✘ 1 after failure
disabled = false
format = "[$symbol]($style) "
success_symbol = "✔"
symbol = "✘ $status"
success_style = "bold #16a34a"
failure_style = "bold #dc2626"
pipestatus = false

[cmd_duration]              # yellow pill, only for commands longer than 2 s
min_time = 2_000
show_milliseconds = false
format = "[](fg:#facc15)[  $duration ](bg:#facc15 fg:#111111 bold)[](fg:#facc15) "

[username]                  # green pill: your user name
show_always = true
format = "[](fg:#166534)[  $user ](bg:#166534 fg:#fde047 bold)[](fg:#166534) "

[hostname]                  # teal pill, only when logged in over SSH (remote machine)
ssh_only = true
trim_at = "."
format = "[](fg:#0e7490)[ 󰒋 $hostname ](bg:#0e7490 fg:#ffffff bold)[](fg:#0e7490) "

[time]                      # light pill
disabled = false
utc_time_offset = "+5.5"    # India Standard Time (UTC+05:30), whatever the Mac's zone
time_format = "%I:%M:%S %p IST"
format = "[](fg:#e5e7eb)[ $time ](bg:#e5e7eb fg:#111111 bold)[](fg:#e5e7eb)"

# ---------- line 2 ----------

[character]
success_symbol = "[❯](bold #22c55e)"
error_symbol = "[❯](bold #ef4444)"
vimcmd_symbol = "[❮](bold #facc15)"
